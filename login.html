<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - ConnectHub</title>

    <link rel="stylesheet"
        href="/style.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Welcome Back</h1>

            <p>
                Login to your account
            </p>


            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>


            <p id="message"></p>


            <p>
                Don't have an account?
                <a href="register.html">
                    Register
                </a>
            </p>

        </div>

    </div>


    <script src="/login.js"></script>

</body>

</html>
